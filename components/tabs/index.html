<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Micra — Tabs</title>
    <link rel="stylesheet" href="../../theme/theme.css" />
    <link rel="stylesheet" href="./tabs.css" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        padding: 3rem;
        background: var(--micra-bg);
        color: var(--micra-fg);
      }
      .demo-bar {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        margin-bottom: 2rem;
      }
      .demo-ghost {
        font: inherit;
        cursor: pointer;
        padding: 0.55rem 1rem;
        background: none;
        color: var(--micra-fg);
        border: 1px solid var(--micra-border);
        border-radius: var(--micra-radius);
      }
    </style>
  </head>
  <body>
    <div class="demo-bar">
      <button class="demo-ghost" id="theme-toggle">Toggle theme</button>
    </div>

    <micra-tabs class="micra-tabs">
      <div
        class="micra-tabs__list"
        role="tablist"
        aria-label="Settings"
        @keydown.left.prevent="prev"
        @keydown.up.prevent="prev"
        @keydown.right.prevent="next"
        @keydown.down.prevent="next"
        @keydown.home.prevent="first"
        @keydown.end.prevent="last"
      >
        <template data-each="tabs" data-key="id">
          <button
            class="micra-tabs__tab"
            type="button"
            role="tab"
            @click="select(item.id)"
            data-bind="id:'tab-' + item.id, aria-controls:'panel-' + item.id, aria-selected:selected === item.id ? 'true' : 'false', aria-disabled:item.disabled ? 'true' : 'false', tabindex:selected === item.id ? 0 : -1, data-state:selected === item.id ? 'active' : 'inactive'"
            data-text="item.label"
          ></button>
        </template>
      </div>

      <template data-each="tabs" data-key="id">
        <div
          class="micra-tabs__panel"
          role="tabpanel"
          tabindex="0"
          data-show="selected === item.id"
          data-bind="id:'panel-' + item.id, aria-labelledby:'tab-' + item.id"
          data-text="item.body"
        ></div>
      </template>
    </micra-tabs>

    <script src="https://cdn.jsdelivr.net/npm/micra.js@2/dist/micra.min.js"></script>
    <script src="./define.js"></script>
    <script>
      // Demo chrome only — light/dark switch.
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const root = document.documentElement;
        root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      });
    </script>
  </body>
</html>
