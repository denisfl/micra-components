<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Micra — Radio group</title>
    <link rel="stylesheet" href="../../theme/theme.css" />
    <link rel="stylesheet" href="./radiogroup.css" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        padding: 3rem;
        background: var(--micra-bg);
        color: var(--micra-fg);
      }
      .demo-bar {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        margin-bottom: 2rem;
      }
      .demo-ghost {
        font: inherit;
        cursor: pointer;
        padding: 0.55rem 1rem;
        background: none;
        color: var(--micra-fg);
        border: 1px solid var(--micra-border);
        border-radius: var(--micra-radius);
      }
      .status {
        margin-top: 1.5rem;
        color: var(--micra-muted);
      }
    </style>
  </head>
  <body>
    <div class="demo-bar">
      <button class="demo-ghost" id="theme-toggle">Toggle theme</button>
    </div>

    <micra-radiogroup class="micra-radiogroup">
      <span class="micra-radiogroup__label" id="plan-label">Choose a plan</span>

      <div
        class="micra-radiogroup__options"
        role="radiogroup"
        aria-labelledby="plan-label"
        @keydown.down.prevent="next"
        @keydown.right.prevent="next"
        @keydown.up.prevent="prev"
        @keydown.left.prevent="prev"
        @keydown.home.prevent="first"
        @keydown.end.prevent="last"
        @keydown.space.prevent="selectFocused"
      >
        <template data-each="options" data-key="id">
          <button
            class="micra-radiogroup__radio"
            type="button"
            role="radio"
            @click="select(item.id)"
            data-bind="id:'radio-' + item.id, data-id:item.id, aria-checked:value === item.id ? 'true' : 'false', aria-disabled:item.disabled ? 'true' : 'false', tabindex:value === item.id ? 0 : -1, data-state:value === item.id ? 'checked' : 'unchecked'"
          >
            <span class="micra-radiogroup__indicator" aria-hidden="true"></span>
            <span class="micra-radiogroup__text">
              <span class="micra-radiogroup__title" data-text="item.label"></span>
              <span class="micra-radiogroup__description" data-text="item.description"></span>
            </span>
          </button>
        </template>
      </div>

      <p class="status" data-text="'Selected: ' + (selectedOption() ? selectedOption().label : 'none')"></p>
    </micra-radiogroup>

    <script src="https://cdn.jsdelivr.net/npm/micra.js@2/dist/micra.min.js"></script>
    <script src="./define.js"></script>
    <script>
      // Demo chrome only — light/dark switch.
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const root = document.documentElement;
        root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      });
    </script>
  </body>
</html>
