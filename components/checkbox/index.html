<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Micra — Checkbox group</title>
    <link rel="stylesheet" href="../../theme/theme.css" />
    <link rel="stylesheet" href="./checkbox.css" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        padding: 3rem;
        background: var(--micra-bg);
        color: var(--micra-fg);
      }
      .demo-bar {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        margin-bottom: 2rem;
      }
      .demo-ghost {
        font: inherit;
        cursor: pointer;
        padding: 0.55rem 1rem;
        background: none;
        color: var(--micra-fg);
        border: 1px solid var(--micra-border);
        border-radius: var(--micra-radius);
      }
      .status {
        margin-top: 1.5rem;
        color: var(--micra-muted);
      }
    </style>
  </head>
  <body>
    <div class="demo-bar">
      <button class="demo-ghost" id="theme-toggle">Toggle theme</button>
    </div>

    <micra-checkbox class="micra-checkbox">
      <span class="micra-checkbox__label" id="perms-label">Permissions</span>

      <div role="group" aria-labelledby="perms-label">
        <button
          class="micra-checkbox__item micra-checkbox__all"
          type="button"
          role="checkbox"
          aria-labelledby="cb-all-label"
          @click="toggleAll"
          @keydown.space.prevent="toggleAll"
          data-bind="aria-checked:allState(), data-state:allDataState()"
        >
          <span class="micra-checkbox__box" aria-hidden="true"></span>
          <span class="micra-checkbox__text" id="cb-all-label">Select all</span>
        </button>

        <div class="micra-checkbox__options">
          <template data-each="options" data-key="id">
            <button
              class="micra-checkbox__item"
              type="button"
              role="checkbox"
              @click="toggle(item.id)"
              @keydown.space.prevent="toggle(item.id)"
              data-bind="id:'cb-' + item.id, aria-labelledby:'cb-' + item.id + '-label', aria-checked:isChecked(item.id) ? 'true' : 'false', aria-disabled:item.disabled ? 'true' : 'false', data-state:isChecked(item.id) ? 'checked' : 'unchecked'"
            >
              <span class="micra-checkbox__box" aria-hidden="true"></span>
              <span
                class="micra-checkbox__text"
                data-bind="id:'cb-' + item.id + '-label'"
                data-text="item.label"
              ></span>
            </button>
          </template>
        </div>
      </div>

      <p class="status" data-text="checkedCount() + ' selected'"></p>
    </micra-checkbox>

    <script src="https://cdn.jsdelivr.net/npm/micra.js@2/dist/micra.min.js"></script>
    <script src="./define.js"></script>
    <script>
      // Demo chrome only — light/dark switch.
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const root = document.documentElement;
        root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      });
    </script>
  </body>
</html>
