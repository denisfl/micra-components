<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Micra — Slider</title>
    <link rel="stylesheet" href="../../theme/theme.css" />
    <link rel="stylesheet" href="./slider.css" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        padding: 3rem;
        background: var(--micra-bg);
        color: var(--micra-fg);
      }
      .demo-bar {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        margin-bottom: 2rem;
      }
      .demo-ghost {
        font: inherit;
        cursor: pointer;
        padding: 0.55rem 1rem;
        background: none;
        color: var(--micra-fg);
        border: 1px solid var(--micra-border);
        border-radius: var(--micra-radius);
      }
      .field {
        max-width: 24rem;
      }
      .field__head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 0.75rem;
      }
      .field__head label {
        user-select: none;
      }
      .field__value {
        font-variant-numeric: tabular-nums;
        color: var(--micra-muted);
      }
    </style>
  </head>
  <body>
    <div class="demo-bar">
      <button class="demo-ghost" id="theme-toggle">Toggle theme</button>
    </div>

    <micra-slider
      class="field"
      data-min="0"
      data-max="100"
      data-step="1"
      data-value="40"
    >
      <div class="field__head">
        <label id="vol-label">Volume</label>
        <span class="field__value" data-text="valueText()"></span>
      </div>

      <div class="micra-slider" data-ref="track" @pointerdown="dragStart">
        <div class="micra-slider__track"></div>
        <div class="micra-slider__fill" data-bind="style:fillStyle()"></div>
        <div
          class="micra-slider__thumb"
          role="slider"
          tabindex="0"
          aria-orientation="horizontal"
          aria-labelledby="vol-label"
          data-ref="thumb"
          data-bind="style:thumbStyle(),
                     aria-valuemin:min, aria-valuenow:value, aria-valuemax:max"
          @keydown.right.prevent="increment"
          @keydown.up.prevent="increment"
          @keydown.left.prevent="decrement"
          @keydown.down.prevent="decrement"
          @keydown.home.prevent="setMin"
          @keydown.end.prevent="setMax"
        ></div>
      </div>
    </micra-slider>

    <script src="https://cdn.jsdelivr.net/npm/micra.js@2/dist/micra.min.js"></script>
    <script src="./define.js"></script>
    <script>
      // Demo chrome only — light/dark switch.
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const root = document.documentElement;
        root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      });
    </script>
  </body>
</html>
