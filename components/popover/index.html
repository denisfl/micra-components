<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Micra — Popover</title>
    <link rel="stylesheet" href="../../theme/theme.css" />
    <link rel="stylesheet" href="./popover.css" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        padding: 3rem;
        background: var(--micra-bg);
        color: var(--micra-fg);
      }
      .demo-bar {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        margin-bottom: 2rem;
      }
      .demo-ghost {
        font: inherit;
        cursor: pointer;
        padding: 0.55rem 1rem;
        background: none;
        color: var(--micra-fg);
        border: 1px solid var(--micra-border);
        border-radius: var(--micra-radius);
      }
      .demo-field {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.625rem;
      }
      .demo-actions {
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="demo-bar">
      <button class="demo-ghost" id="theme-toggle">Toggle theme</button>
    </div>

    <micra-popover>
      <!-- The panel is a native popover anchored to the trigger (CSS anchor
           positioning, or define.js where the browser lacks it). -->
      <div class="micra-popover">
        <button
          class="micra-popover__trigger"
          data-ref="trigger"
          aria-haspopup="dialog"
          aria-controls="popover-panel"
          data-bind="aria-expanded:isOpen ? 'true' : 'false'"
          popovertarget="popover-panel"
        >
          Filters
        </button>

        <div
          class="micra-popover__panel"
          id="popover-panel"
          role="dialog"
          popover
          aria-labelledby="popover-title"
          data-ref="panel"
          tabindex="-1"
          @toggle="onToggle"
        >
          <h2 id="popover-title" class="micra-popover__title">Filters</h2>

          <label class="demo-field">
            <input type="checkbox" name="in-stock" checked />
            In stock only
          </label>
          <label class="demo-field">
            <input type="checkbox" name="on-sale" />
            On sale
          </label>
          <label class="demo-field">
            <input type="checkbox" name="free-shipping" />
            Free shipping
          </label>

          <div class="demo-actions">
            <button class="micra-btn" @click="close">Apply</button>
          </div>
        </div>
      </div>
    </micra-popover>

    <script src="https://cdn.jsdelivr.net/npm/micra.js@2/dist/micra.min.js"></script>
    <script src="./define.js"></script>
    <script>
      // Demo chrome only — light/dark switch.
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const root = document.documentElement;
        root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      });
    </script>
  </body>
</html>
