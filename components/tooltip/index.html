<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Micra — Tooltip</title>
    <link rel="stylesheet" href="../../theme/theme.css" />
    <link rel="stylesheet" href="./tooltip.css" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        padding: 3rem;
        background: var(--micra-bg);
        color: var(--micra-fg);
      }
      .demo-bar {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        margin-bottom: 2rem;
      }
      .demo-ghost {
        font: inherit;
        cursor: pointer;
        padding: 0.55rem 1rem;
        background: none;
        color: var(--micra-fg);
        border: 1px solid var(--micra-border);
        border-radius: var(--micra-radius);
      }
      .demo-row {
        display: flex;
        gap: 1.5rem;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="demo-bar">
      <button class="demo-ghost" id="theme-toggle">Toggle theme</button>
    </div>

    <div class="demo-row">
      <micra-tooltip
        class="micra-tooltip-wrap"
        @mouseenter="open"
        @mouseleave="close"
        @focusin="open"
        @focusout="close"
        @keydown.escape="close"
      >
        <button class="micra-btn" aria-describedby="tip-1">Hover or focus me</button>

        <span
          class="micra-tooltip"
          id="tip-1"
          role="tooltip"
          data-bind="data-state:open ? 'open' : 'closed'"
        >
          Appears after a short delay on hover or focus.
        </span>
      </micra-tooltip>

      <micra-tooltip
        class="micra-tooltip-wrap"
        data-delay="700"
        @mouseenter="open"
        @mouseleave="close"
        @focusin="open"
        @focusout="close"
        @keydown.escape="close"
      >
        <button class="micra-btn" aria-describedby="tip-2">Another</button>

        <span
          class="micra-tooltip"
          id="tip-2"
          role="tooltip"
          data-bind="data-state:open ? 'open' : 'closed'"
        >
          A separate instance with its own 700ms delay. Press Escape to dismiss.
        </span>
      </micra-tooltip>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/micra.js@2/dist/micra.min.js"></script>
    <script src="./define.js"></script>
    <script>
      // Demo chrome only — light/dark switch.
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const root = document.documentElement;
        root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      });
    </script>
  </body>
</html>
