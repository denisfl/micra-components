<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Micra — Combobox</title>
    <link rel="stylesheet" href="../../theme/theme.css" />
    <link rel="stylesheet" href="./combobox.css" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        padding: 3rem;
        background: var(--micra-bg);
        color: var(--micra-fg);
      }
      .demo-bar {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        margin-bottom: 2rem;
      }
      .demo-ghost {
        font: inherit;
        cursor: pointer;
        padding: 0.55rem 1rem;
        background: none;
        color: var(--micra-fg);
        border: 1px solid var(--micra-border);
        border-radius: var(--micra-radius);
      }
      .demo-selected {
        margin-top: 1.25rem;
        color: var(--micra-muted);
      }
    </style>
  </head>
  <body>
    <div class="demo-bar">
      <button class="demo-ghost" id="theme-toggle">Toggle theme</button>
    </div>

    <micra-combobox
      class="micra-combobox" @pointerdown.outside="close"
      data-options='[
        {"id":"react","label":"React"},
        {"id":"vue","label":"Vue"},
        {"id":"svelte","label":"Svelte"},
        {"id":"solid","label":"SolidJS"},
        {"id":"angular","label":"Angular"},
        {"id":"preact","label":"Preact"},
        {"id":"qwik","label":"Qwik"},
        {"id":"alpine","label":"Alpine.js"},
        {"id":"lit","label":"Lit"},
        {"id":"micra","label":"Micra.js"}
      ]'
    >
      <input
        class="micra-combobox__input"
        role="combobox"
        aria-autocomplete="list"
        aria-controls="cb-listbox"
        placeholder="Search frameworks…"
        autocomplete="off"
        data-model="query"
        data-bind="aria-expanded:open ? 'true' : 'false', aria-activedescendant:activeDescendant()"
        @input="onInput"
        @focus="onFocus"
        @keydown.down.prevent="next"
        @keydown.up.prevent="prev"
        @keydown.enter.prevent="choose"
        @keydown.escape="close"
        @keydown.tab="close"
      />

      <ul
        class="micra-combobox__listbox"
        id="cb-listbox"
        role="listbox"
        data-bind="data-state:open ? 'open' : 'closed'"
      >
        <template data-each="filtered()" data-key="id">
          <li
            class="micra-combobox__option"
            role="option"
            data-bind="id:'cb-option-' + item.id, aria-selected:selectedId === item.id ? 'true' : 'false', data-state:item.id === activeId ? 'active' : ''"
            data-text="item.label"
            @click="select(item.id)"
            @mousemove="setActive(item.id)"
          ></li>
        </template>
        <li class="micra-combobox__empty" role="presentation" data-if="noResults()">No results</li>
      </ul>

      <p class="demo-selected">Selected: <strong data-text="selectedLabel()"></strong></p>
    </micra-combobox>

    <script src="https://cdn.jsdelivr.net/npm/micra.js@2/dist/micra.min.js"></script>
    <script src="./define.js"></script>
    <script>
      // Demo chrome only — light/dark switch.
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const root = document.documentElement;
        root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      });
    </script>
  </body>
</html>
