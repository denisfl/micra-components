<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Micra — Toast</title>
    <link rel="stylesheet" href="../../theme/theme.css" />
    <link rel="stylesheet" href="./toast.css" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        padding: 3rem;
        background: var(--micra-bg);
        color: var(--micra-fg);
      }
      .demo-bar {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        margin-bottom: 2rem;
      }
      .demo-ghost {
        font: inherit;
        cursor: pointer;
        padding: 0.55rem 1rem;
        background: none;
        color: var(--micra-fg);
        border: 1px solid var(--micra-border);
        border-radius: var(--micra-radius);
      }
      .demo-btn {
        font: inherit;
        cursor: pointer;
        padding: 0.55rem 1rem;
        color: var(--micra-primary-fg);
        background: var(--micra-primary);
        border: 0;
        border-radius: var(--micra-radius);
      }
    </style>
  </head>
  <body>
    <div class="demo-bar">
      <button class="demo-ghost" id="theme-toggle">Toggle theme</button>
    </div>

    <div class="demo-bar">
      <button
        class="demo-btn"
        onclick="Micra.emit('toast', { message: 'Saved your changes.', type: 'info' })"
      >
        Show info
      </button>
      <button
        class="demo-btn"
        onclick="Micra.emit('toast', { message: 'Project published.', type: 'success' })"
      >
        Show success
      </button>
      <button
        class="demo-btn"
        onclick="Micra.emit('toast', { message: 'Something went wrong.', type: 'error' })"
      >
        Show error
      </button>
    </div>

    <!-- The notifications manager — mounted once. Its region/list lives inside. -->
    <micra-toast>
      <div
        class="micra-toasts"
        role="region"
        aria-label="Notifications"
        aria-live="polite"
      >
        <template data-each="toasts" data-key="id">
          <div role="status" data-bind="class:toastClass(item)">
            <span data-text="item.message"></span>
            <button @click="dismiss(item.id)" aria-label="Dismiss">&times;</button>
          </div>
        </template>
      </div>
    </micra-toast>

    <script src="https://cdn.jsdelivr.net/npm/micra.js@2/dist/micra.min.js"></script>
    <script src="./define.js"></script>
    <script>
      // Demo chrome only — light/dark switch.
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const root = document.documentElement;
        root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      });
    </script>
  </body>
</html>
