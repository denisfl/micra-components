<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Micra — Listbox</title>
    <link rel="stylesheet" href="../../theme/theme.css" />
    <link rel="stylesheet" href="./listbox.css" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        padding: 3rem;
        background: var(--micra-bg);
        color: var(--micra-fg);
      }
      .demo-bar {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        margin-bottom: 2rem;
      }
      .demo-ghost {
        font: inherit;
        cursor: pointer;
        padding: 0.55rem 1rem;
        background: none;
        color: var(--micra-fg);
        border: 1px solid var(--micra-border);
        border-radius: var(--micra-radius);
      }
      .demo-selected {
        margin-top: 1.25rem;
        color: var(--micra-muted);
      }
      .demo-selected strong {
        color: var(--micra-fg);
      }
    </style>
  </head>
  <body>
    <div class="demo-bar">
      <button class="demo-ghost" id="theme-toggle">Toggle theme</button>
    </div>

    <micra-listbox @pointerdown.outside="close"
      data-options='[
        {"id":"react","label":"React"},
        {"id":"vue","label":"Vue"},
        {"id":"svelte","label":"Svelte"},
        {"id":"solid","label":"SolidJS"},
        {"id":"angular","label":"Angular"},
        {"id":"ember","label":"Ember","disabled":true},
        {"id":"preact","label":"Preact"},
        {"id":"qwik","label":"Qwik"},
        {"id":"lit","label":"Lit"},
        {"id":"micra","label":"Micra.js"}
      ]'
    >
      <!-- .micra-listbox is the positioning context: it must wrap ONLY the
           button and the list, so the list anchors under the button. Sibling
           content (like the status line below) lives outside it. -->
      <div class="micra-listbox">
        <button
          class="micra-listbox__button"
          role="combobox"
          aria-haspopup="listbox"
          aria-controls="lb-listbox"
          data-ref="button"
          data-bind="aria-expanded:open ? 'true' : 'false'"
          @click="toggle"
          @keydown.down.prevent="open"
          @keydown.up.prevent="open"
          @keydown.enter.prevent="toggle"
          @keydown.space.prevent="toggle"
        >
          <span
            class="micra-listbox__value"
            data-placeholder="Select a framework"
            data-text="selectedLabel()"
          ></span>
          <span class="micra-listbox__caret" aria-hidden="true">▾</span>
        </button>

        <ul
          class="micra-listbox__list"
          id="lb-listbox"
          role="listbox"
          data-ref="list"
          tabindex="-1"
          data-bind="data-state:open ? 'open' : 'closed', aria-activedescendant:activeDescendant()"
          @keydown.down.prevent="next"
          @keydown.up.prevent="prev"
          @keydown.home.prevent="first"
          @keydown.end.prevent="last"
          @keydown.enter.prevent="choose"
          @keydown.space.prevent="choose"
          @keydown.escape="close"
        >
          <template data-each="options" data-key="id">
            <li
              class="micra-listbox__option"
              role="option"
              data-bind="id:'lb-option-' + item.id, aria-selected:value === item.id ? 'true' : 'false', aria-disabled:item.disabled ? 'true' : 'false', data-state:item.id === activeId ? 'active' : ''"
              @click="select(item.id)"
            >
              <span data-text="item.label"></span>
              <span class="micra-listbox__check" aria-hidden="true">✓</span>
            </li>
          </template>
        </ul>
      </div>

      <p class="demo-selected">Selected: <strong data-text="selectedLabel() || '—'"></strong></p>
    </micra-listbox>

    <script src="https://cdn.jsdelivr.net/npm/micra.js@2/dist/micra.min.js"></script>
    <script src="./define.js"></script>
    <script>
      // Demo chrome only — light/dark switch.
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const root = document.documentElement;
        root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      });
    </script>
  </body>
</html>
