<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Micra — Breadcrumbs</title>
    <link rel="stylesheet" href="../../theme/theme.css" />
    <link rel="stylesheet" href="./breadcrumbs.css" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        padding: 3rem;
        background: var(--micra-bg);
        color: var(--micra-fg);
      }
      .demo-bar {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        margin-bottom: 2rem;
      }
      .demo-ghost {
        font: inherit;
        cursor: pointer;
        padding: 0.55rem 1rem;
        background: none;
        color: var(--micra-fg);
        border: 1px solid var(--micra-border);
        border-radius: var(--micra-radius);
      }
    </style>
  </head>
  <body>
    <div class="demo-bar">
      <button class="demo-ghost" id="theme-toggle">Toggle theme</button>
    </div>

    <nav data-component="breadcrumbs" aria-label="Breadcrumb">
      <ol class="micra-breadcrumbs">
        <template data-each="items" data-key="id">
          <li class="micra-breadcrumbs__crumb">
            <a
              class="micra-breadcrumbs__link"
              data-show="!isLast(index)"
              data-bind="href:item.href || '#'"
              @click.prevent="navigate(item.id)"
              data-text="item.label"
            ></a>
            <span
              class="micra-breadcrumbs__current"
              data-show="isLast(index)"
              aria-current="page"
              data-text="item.label"
            ></span>
          </li>
        </template>
      </ol>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/micra.js@2/dist/micra.min.js"></script>
    <script src="./define.js"></script>
    <script>
      Micra.start();

      // Demo only — log the navigate intent the component emits on a crumb click.
      Micra.on('navigate', (item) => console.log('navigate:', item.id, item.label));

      // Demo chrome only — light/dark switch.
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const root = document.documentElement;
        root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      });
    </script>
  </body>
</html>
