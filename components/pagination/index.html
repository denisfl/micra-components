<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Micra — Pagination</title>
    <link rel="stylesheet" href="../../theme/theme.css" />
    <link rel="stylesheet" href="./pagination.css" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        padding: 3rem;
        background: var(--micra-bg);
        color: var(--micra-fg);
      }
      .demo-bar {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        margin-bottom: 2rem;
      }
      .demo-ghost {
        font: inherit;
        cursor: pointer;
        padding: 0.55rem 1rem;
        background: none;
        color: var(--micra-fg);
        border: 1px solid var(--micra-border);
        border-radius: var(--micra-radius);
      }
      .demo-status {
        margin-top: 1.25rem;
        color: var(--micra-muted);
      }
    </style>
  </head>
  <body>
    <div class="demo-bar">
      <button class="demo-ghost" id="theme-toggle">Toggle theme</button>
    </div>

    <nav
      class="micra-pagination"
      data-component="pagination"
      data-page="1"
      data-total="12"
      aria-label="Pagination"
    >
      <button
        class="micra-pagination__nav"
        type="button"
        @click="prev"
        data-bind="disabled:atStart(), aria-disabled:atStart() ? 'true' : 'false'"
      >
        Previous
      </button>

      <template data-each="pages()" data-key="key">
        <button
          class="micra-pagination__item"
          type="button"
          data-if="item.type === 'page'"
          @click="select(item.n)"
          data-text="item.n"
          data-bind="aria-current:isCurrent(item.n) ? 'page' : 'false', data-state:isCurrent(item.n) ? 'current' : ''"
        ></button>
        <span
          class="micra-pagination__gap"
          data-if="item.type === 'gap'"
          aria-hidden="true"
        >&hellip;</span>
      </template>

      <button
        class="micra-pagination__nav"
        type="button"
        @click="next"
        data-bind="disabled:atEnd(), aria-disabled:atEnd() ? 'true' : 'false'"
      >
        Next
      </button>
    </nav>

    <p class="demo-status">
      Page <span data-text="page"></span> of <span data-text="total"></span>
    </p>

    <script src="https://cdn.jsdelivr.net/npm/micra.js@2/dist/micra.min.js"></script>
    <script src="./define.js"></script>
    <script>
      Micra.start();

      // Demo chrome only — light/dark switch.
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const root = document.documentElement;
        root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      });
    </script>
  </body>
</html>
